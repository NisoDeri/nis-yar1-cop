[project]
name = "pursuit"
version = "0.1.0"
description = "P2P Cops & Robbers agents - group nis-yar1 (Orchestration of AI Agents, Dr. Yoram Segal)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false  # Hebrew path breaks editable installs on Windows; run with PYTHONPATH=src

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85 -q"
pythonpath = ["src"]

[tool.coverage.run]
omit = ["src/pursuit/interface/*"]
